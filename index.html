                      <div className="flex items-center justify-between lg:flex-col lg:items-end gap-3">

                          <span className="font-mono text-2xl font-bold text-amber-300">
                            {currencyConfig.format(fare)}
                          </span>
                          <span className="block text-[10px] text-neutral-400">All-Inclusive Luxury</span>
                        </div>
                        <button
                          onClick={() => setSelectedFlight(flight)}
                          className={`rounded-xl px-5 py-2.5 text-xs font-bold uppercase tracking-wider transition ${
                            isCurrent
                              ? 'bg-emerald-500 text-neutral-950'
                              : 'bg-amber-400 text-neutral-950 hover:bg-amber-300'
                          }`}
                        >
                          {isCurrent ? 'Flight Selected ✓' : t('btn_select_flight')}
                        </button>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </section>

          {/* Module 2: 3D Seat Map */}
          <section id="seats" className="py-12 px-4 max-w-7xl mx-auto border-t border-white/10">
            <div className="mb-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
              <div>
                <span className="font-mono text-xs text-amber-400 uppercase">Interactive Cabin Layout</span>
                <h2 className="font-serif text-2xl sm:text-3xl font-bold text-white">{t('seat_map_title')}</h2>
              </div>
              <div className="flex gap-4 text-xs font-mono">
                <span className="flex items-center gap-1.5"><span className="h-3 w-3 rounded border border-amber-400 bg-amber-400/20"></span> {t('seat_available')}</span>
                <span className="flex items-center gap-1.5"><span className="h-3 w-3 rounded bg-cyan-400"></span> {t('seat_selected')}</span>
                <span className="flex items-center gap-1.5"><span className="h-3 w-3 rounded bg-neutral-800"></span> {t('seat_occupied')}</span>
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              {/* Aircraft Cabin Fuselage */}
              <div className="rounded-3xl border border-white/15 bg-gradient-to-b from-[#0a0e1a] to-[#04060a] p-6 lg:col-span-8">
                <div className="mx-auto mb-6 w-32 h-10 rounded-t-full border-t-2 border-x-2 border-amber-400/40 text-center text-[10px] font-mono text-amber-300 pt-1">
                  COCKPIT
                </div>

                {/* ZONE 1: Royal Suites */}
                <div className="mb-6 rounded-2xl border border-amber-400/30 bg-amber-500/5 p-4">
                  <div className="mb-3 text-xs font-mono text-amber-300 font-bold">
                    ZONE 1: SOVEREIGN ROYAL SUITES (1-1-1 Enclosed)
                  </div>
                  <div className="space-y-3">
                    {[1, 2].map((r) => (
                      <div key={r} className="flex justify-between items-center gap-2">
                        {INITIAL_SEATS.filter((s) => s.row === r).map((seat) => {
                          const isSel = selectedSeats.some((s) => s.id === seat.id);
                          return (
                            <button
                              key={seat.id}
                              disabled={seat.isOccupied}
                              onClick={() => toggleSeat(seat)}
                              className={`flex-1 h-20 rounded-xl border p-2 flex flex-col justify-between items-center transition ${
                                seat.isOccupied
                                  ? 'opacity-30 border-neutral-800 bg-neutral-900 cursor-not-allowed'
                                  : isSel
                                  ? 'border-cyan-400 bg-cyan-500/20 text-cyan-300 ring-2 ring-cyan-400'
                                  : 'border-amber-400/40 bg-white/5 text-neutral-200 hover:border-amber-400'
                              }`}
                            >
                              <span className="font-mono text-xs font-bold">SUITE {seat.id}</span>
                              <span className="text-[10px] text-amber-300">{seat.isOccupied ? 'Occupied' : currencyConfig.format(seat.priceUSD)}</span>
                              <span className="text-[9px] uppercase tracking-wider text-neutral-400">{isSel ? 'SELECTED' : 'ROYAL'}</span>
                            </button>
                          );
                        })}
                      </div>
                    ))}
                  </div>
                </div>

                {/* ZONE 2: Business & Premium */}
                <div className="rounded-2xl border border-white/10 bg-white/[0.02] p-4">
                  <div className="mb-3 text-xs font-mono text-neutral-400 font-bold">
                    ZONE 2: AURA BUSINESS LIE-FLAT & PRESTIGE
                  </div>
                  <div className="grid grid-cols-4 gap-2">
                    {INITIAL_SEATS.filter((s) => s.row >= 3).map((seat) => {
                      const isSel = selectedSeats.some((s) => s.id === seat.id);
                      return (
                        <button
                          key={seat.id}
                          disabled={seat.isOccupied}
                          onClick={() => toggleSeat(seat)}
                          className={`h-12 rounded-lg border text-xs font-mono font-bold flex flex-col items-center justify-center transition ${
                            seat.isOccupied
                              ? 'opacity-30 border-neutral-800 bg-neutral-900 cursor-not-allowed'
                              : isSel
                              ? 'border-cyan-400 bg-cyan-500 text-black'
                              : 'border-white/10 bg-white/5 text-neutral-300 hover:border-amber-400'
                          }`}
                        >
                          <span>{seat.id}</span>
                          <span className="text-[9px] font-normal">{seat.isOccupied ? 'X' : currencyConfig.symbol}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>

              {/* Selection Summary Sidebar */}
              <div className="rounded-3xl border border-white/15 bg-[#0e1424] p-6 flex flex-col justify-between lg:col-span-4">
                <div>
                  <h3 className="font-serif text-lg font-bold text-white border-b border-white/10 pb-3">
                    Seat & Suite Upgrade Summary
                  </h3>
                  <div className="mt-4 space-y-3 text-xs font-mono">
                    <div className="flex justify-between text-neutral-400">
                      <span>Selected Count:</span>
                      <span className="text-white font-bold">{selectedSeats.length} Seat(s)</span>
                    </div>
                    <div className="flex justify-between text-neutral-400">
                      <span>Seat IDs:</span>
                      <span className="text-amber-300 font-bold">
                        {selectedSeats.map((s) => s.id).join(', ') || 'None'}
                      </span>
                    </div>
                    <div className="flex justify-between text-neutral-400">
                      <span>Upgrade Total:</span>
                      <span className="text-xl font-bold text-white">
                        {currencyConfig.format(selectedSeats.reduce((a, b) => a + b.priceUSD, 0))}
                      </span>
                    </div>
                  </div>

                  <div className="mt-6 rounded-xl border border-amber-400/20 bg-amber-500/5 p-3 text-xs text-neutral-300">
                    <p className="text-[11px] leading-relaxed">{t('seat_suite_perks')}</p>
                  </div>
                </div>

                <div className="mt-6">
                  <button
                    onClick={() => setIsBoardingPassOpen(true)}
                    className="w-full rounded-xl bg-gradient-to-r from-amber-400 to-amber-500 py-3 text-xs font-bold uppercase tracking-wider text-neutral-950 shadow-lg shadow-amber-400/20 hover:from-amber-300 transition"
                  >
                    Generate Sovereign Boarding Pass
                  </button>
                </div>
              </div>
            </div>
          </section>

          {/* e-KYC Modal with Live WebRTC Camera */}
          {isKycModalOpen && (
            <KycModal
              destination={selectedFlight.destination}
              onClose={() => setIsKycModalOpen(false)}
              onVerified={(data) => {
                setKycData(data);
                setIsKycModalOpen(false);
              }}
              t={t}
            />
          )}

          {/* Boarding Pass Modal */}
          {isBoardingPassOpen && (
            <BoardingPassModalView
              flight={selectedFlight}
              seat={selectedSeats[0] || null}
              kycData={kycData}
              currencyConfig={currencyConfig}
              onClose={() => setIsBoardingPassOpen(false)}
              t={t}
            />
          )}
        </div>
      );
    }

    // --- SUB-COMPONENT: WEBRTC e-KYC MODAL ---
    function KycModal({ destination, onClose, onVerified, t }) {
      const [stage, setStage] = useState('PASSPORT'); // PASSPORT -> FACE -> DONE
      const [cameraActive, setCameraActive] = useState(false);
      const [processing, setProcessing] = useState(false);
      const videoRef = useRef(null);
      const streamRef = useRef(null);

      useEffect(() => {
        let active = true;
        navigator.mediaDevices?.getUserMedia({ video: { width: 1280, height: 720 }, audio: false })
          .then((stream) => {
            if (active) {
              streamRef.current = stream;
              if (videoRef.current) videoRef.current.srcObject = stream;
              setCameraActive(true);
            }
          })
          .catch((err) => {
            console.log('WebRTC camera simulation active:', err);
            setCameraActive(false);
          });

        return () => {
          active = false;
          if (streamRef.current) {
            streamRef.current.getTracks().forEach((track) => track.stop());
          }
        };
      }, []);

      const capturePassport = () => {
        setProcessing(true);
        setTimeout(() => {
          setProcessing(false);
          setStage('FACE');
        }, 1200);
      };

      const verifyFace = () => {
        setProcessing(true);
        setTimeout(() => {
          const verifiedData = {
            fullName: 'HIS HIGHNESS TARIQ AL-HASHIMI',
            passportNumber: 'N9872140A',
            nationality: 'ARE (United Arab Emirates)',
            expiryDate: '2032-11-09',
            gender: 'M',
            icaoVerified: true,
            mrzRaw: 'P<AREAL<HASHIMI<<TARIQ<<<<<<<<<<<<<<<<<<<<<<<\nN9872140A3ARE8804144M3211096<<<<<<<<<<<<<<04',
            visaStatus: 'EXEMPT'
          };
          setProcessing(false);
          setStage('DONE');
          onVerified(verifiedData);
        }, 1500);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4 backdrop-blur-xl">
          <div className="relative w-full max-w-3xl overflow-hidden rounded-3xl border border-amber-400/40 bg-[#0a0d14] shadow-2xl">
            {/* Modal Header */}
            <div className="flex items-center justify-between border-b border-white/10 bg-[#0e1424] px-6 py-4">
              <div>
                <h3 className="font-serif text-lg font-bold text-white">Bank-Grade e-KYC Passport Verification</h3>
                <p className="text-xs text-neutral-400">ICAO Doc 9303 Compliant • WebRTC Telemetry Active</p>
              </div>
              <button onClick={onClose} className="text-neutral-400 hover:text-white">✕</button>
            </div>

            {/* Content Body */}
            <div className="p-6">
              <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
                {/* Camera Viewport */}
                <div className="relative aspect-video w-full rounded-2xl border border-white/15 bg-neutral-950 overflow-hidden md:col-span-8 flex items-center justify-center">
                  <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover" />

                  {!cameraActive && (
                    <div className="absolute inset-0 flex flex-col items-center justify-center bg-neutral-900/90 p-4 text-center">
                      <div className="h-16 w-16 rounded-2xl border border-amber-400/40 bg-amber-500/10 flex items-center justify-center text-amber-300 font-mono text-2xl mb-2">
                        ICAO
                      </div>
                      <span className="font-bold text-white text-sm">WebRTC Optical Scanner Simulation</span>
                      <span className="text-xs text-neutral-400 mt-1">Camera guide reticles active</span>
                    </div>
                  )}

                  {/* Stage 1 Laser Bounding Guide */}
                  {stage === 'PASSPORT' && (
                    <div className="pointer-events-none absolute inset-4 rounded-xl border-2 border-dashed border-amber-400/70 flex flex-col justify-between p-2">
                      <div className="flex justify-between text-[10px] font-mono text-amber-300">
                        <span>┌ FOCUS ZONE</span>
                        <span>16:9 RATIO ┐</span>
                      </div>
                      <div className="w-full h-1 bg-gradient-to-r from-transparent via-amber-300 to-transparent shadow-[0_0_15px_#d4af37] animate-laser"></div>
                      <div className="text-center font-mono text-[10px] text-amber-300 bg-black/60 py-1 rounded">
                        ALIGN MACHINE READABLE PASSPORT ZONE
                      </div>
                    </div>
                  )}

                  {/* Stage 2 Biometric Oval */}
                  {stage === 'FACE' && (
                    <div className="pointer-events-none absolute h-56 w-44 rounded-[50%] border-2 border-dashed border-cyan-400 shadow-[0_0_30px_rgba(6,182,212,0.4)] flex items-center justify-center">
                      <div className="text-center font-mono text-[10px] text-cyan-300">
                        BIOMETRIC MESH LOCKED
                      </div>
                    </div>
                  )}

                  {processing && (
                    <div className="absolute inset-0 bg-black/80 flex flex-col items-center justify-center font-mono text-xs text-amber-300">
                      <div className="h-8 w-8 border-2 border-amber-400 border-t-transparent rounded-full animate-spin mb-2"></div>
                      CRYPTOGRAPHIC VALIDATION IN PROGRESS...
                    </div>
                  )}
                </div>

                {/* Controls Sidebar */}
                <div className="flex flex-col justify-between rounded-2xl border border-white/10 bg-white/[0.02] p-5 md:col-span-4">
                  <div>
                    <h4 className="font-serif text-base font-bold text-amber-300">
                      {stage === 'PASSPORT' ? t('scanner_step1_title') : t('scanner_step2_title')}
                    </h4>
                    <p className="mt-2 text-xs text-neutral-300 leading-relaxed">
                      {stage === 'PASSPORT' ? t('scanner_step1_desc') : t('scanner_step2_desc')}
                    </p>
                  </div>

                  <div className="mt-6">
                    {stage === 'PASSPORT' ? (
                      <button
                        onClick={capturePassport}
                        disabled={processing}
                        className="w-full rounded-xl bg-gradient-to-r from-amber-400 to-amber-500 py-3 text-xs font-bold uppercase tracking-wider text-neutral-950 shadow-lg shadow-amber-400/20 hover:from-amber-300 transition"
                      >
                        {t('camera_capture_passport')}
                      </button>
                    ) : (
                      <button
                        onClick={verifyFace}
                        disabled={processing}
                        className="w-full rounded-xl bg-gradient-to-r from-cyan-400 to-blue-500 py-3 text-xs font-bold uppercase tracking-wider text-white shadow-lg shadow-cyan-400/20 hover:from-cyan-300 transition"
                      >
                        {t('camera_capture_face')}
                      </button>
                    )}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- SUB-COMPONENT: BOARDING PASS MODAL VIEW ---
    function BoardingPassModalView({ flight, seat, kycData, currencyConfig, onClose, t }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4 backdrop-blur-xl">
          <div className="relative w-full max-w-2xl rounded-3xl border border-amber-400/40 bg-[#0a0d14] p-6 shadow-2xl">
            <div className="flex justify-between items-center border-b border-white/10 pb-4 mb-4">
              <span className="font-serif text-lg font-bold text-white">AURA AERO • ROYAL BOARDING PASS</span>
              <button onClick={onClose} className="text-neutral-400 hover:text-white">✕</button>
            </div>

            <div className="rounded-2xl border border-amber-400/30 bg-[#0e1424] p-6">
              <div className="flex justify-between border-b border-white/10 pb-4">
                <div>
                  <span className="text-[10px] font-mono text-neutral-400 block">PASSENGER NAME</span>
                  <span className="font-bold text-white text-base">
                    {kycData ? kycData.fullName : 'HIS HIGHNESS TARIQ AL-HASHIMI'}
                  </span>
                </div>
                <div className="text-right">
                  <span className="text-[10px] font-mono text-neutral-400 block">FLIGHT & SUITE</span>
                  <span className="font-mono font-bold text-amber-300">
                    {flight.flightNumber} • {seat ? seat.id : '1A'}
                  </span>
                </div>
              </div>

              <div className="my-6 flex justify-between items-center text-center">
                <div>
                  <span className="font-mono text-3xl font-bold text-white">{flight.origin.iata}</span>
                  <span className="block text-xs text-neutral-400">{flight.origin.city}</span>
                </div>
                <div className="text-xs font-mono text-cyan-300">
                  {flight.duration}
                  <div className="h-[2px] w-28 bg-gradient-to-r from-amber-400 to-cyan-400 my-1"></div>
                  NON-STOP
                </div>
                <div>
                  <span className="font-mono text-3xl font-bold text-white">{flight.destination.iata}</span>
                  <span className="block text-xs text-neutral-400">{flight.destination.city}</span>
                </div>
              </div>

              {/* High Resolution SVG QR Simulation */}
              <div className="flex items-center justify-between border-t border-dashed border-white/20 pt-4">
                <div className="h-20 w-20 bg-white p-1.5 rounded-xl">
                  <svg viewBox="0 0 100 100" className="w-full h-full">
                    <rect width="100" height="100" fill="white" />
                    <rect x="5" y="5" width="30" height="30" fill="#07090e" />
                    <rect x="10" y="10" width="20" height="20" fill="white" />
                    <rect x="14" y="14" width="12" height="12" fill="#07090e" />
                    <rect x="65" y="5" width="30" height="30" fill="#07090e" />
                    <rect x="70" y="10" width="20" height="20" fill="white" />
                    <rect x="74" y="14" width="12" height="12" fill="#07090e" />
                    <rect x="5" y="65" width="30" height="30" fill="#07090e" />
                    <rect x="10" y="70" width="20" height="20" fill="white" />
                    <rect x="14" y="74" width="12" height="12" fill="#07090e" />
                    <rect x="42" y="15" width="8" height="8" fill="#07090e" />
                    <rect x="45" y="45" width="14" height="14" fill="#07090e" />
                    <rect x="70" y="70" width="15" height="15" fill="#07090e" />
                  </svg>
                </div>
                <div className="text-right font-mono text-xs">
                  <span className="block text-neutral-400">BOARDING GATE: A12</span>
                  <span className="block text-cyan-300 font-bold">STATUS: ICAO PKD CLEARED</span>
                  <span className="block text-[10px] text-neutral-500 mt-1">PNR: AU99X2</span>
                </div>
              </div>
            </div>

            <div className="mt-6 flex gap-3">
              <button
                onClick={() => alert('Synced with Apple Wallet!')}
                className="flex-1 rounded-xl border border-white/20 bg-white/5 py-2.5 text-xs font-semibold text-white hover:bg-white/10"
              >
                {t('btn_apple_wallet')}
              </button>
              <button
                onClick={() => alert('Synced with Google Wallet!')}
                className="flex-1 rounded-xl border border-white/20 bg-white/5 py-2.5 text-xs font-semibold text-white hover:bg-white/10"
              >
                {t('btn_google_wallet')}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Render the React application into the DOM
    ReactDOM.render(<AirlineApp />, document.getElementById('root'));
  </script>
</body>
</html>
