                        <span className="text-[10px] text-amber-300 font-mono">
                          {lang === 'ur' ? 'سائیڈ مینو اور تمام سہولیات' : 'Side Navigation & Services'}
                        </span>
                      </div>
                    </div>

                    <button
                      onClick={() => setIsSideDrawerOpen(false)}
                      className="flex h-10 w-10 items-center justify-center rounded-2xl border border-white/15 bg-white/5 text-neutral-400 hover:text-white hover:bg-white/10 transition"
                      title="Close"
                    >
                      <CloseSvg className="h-5 w-5" />
                    </button>
                  </div>

                  {/* Customer Profile Card in Drawer */}
                  <div className="mb-6 rounded-2xl border border-amber-400/30 bg-amber-500/10 p-4">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <IconBox className="bg-amber-400 text-neutral-950 font-bold border-none shadow-md">
                          <span className="text-base font-bold">
                            {currentUser ? currentUser.name.charAt(0).toUpperCase() : 'H'}
                          </span>
                        </IconBox>
                        <div>
                          <span className="font-bold text-white text-sm block">
                            {currentUser ? currentUser.name : 'Hamza Latif'}
                          </span>
                          <span className="font-mono text-[10px] text-amber-300 block">
                            CNIC: {currentUser ? currentUser.cnic : '31302-5257137-7'}
                          </span>
                          <span className="text-[10px] text-emerald-400 font-semibold block">
                            NADRA CNIC Verified ✓
                          </span>
                        </div>
                      </div>

                      {currentUser ? (
                        <button
                          onClick={() => {
                            setCurrentUser(null);
                            localStorage.removeItem('flywithsky_user');
                          }}
                          className="flex h-10 w-10 items-center justify-center rounded-2xl border border-white/10 bg-white/5 text-neutral-400 hover:text-red-400 hover:bg-white/10 transition"
                          title="Sign Out"
                        >
                          <LogoutSvg className="h-5 w-5" />
                        </button>
                      ) : (
                        <button
                          onClick={() => {
                            setIsSideDrawerOpen(false);
                            setIsAuthOpen(true);
                          }}
                          className="rounded-xl bg-amber-400 px-3.5 py-2 text-xs font-bold text-neutral-950 shadow hover:bg-amber-300 transition"
                        >
                          Login
                        </button>
                      )}
                    </div>
                  </div>

                  {/* Navigation Links with EXACT SAME SIZE IconBox */}
                  <div className="space-y-2.5">
                    {/* 1. Flight Booking Portal */}
                    <button
                      onClick={() => {
                        setCurrentView('MAIN');
                        setIsSideDrawerOpen(false);
                        setBookingStep('SEARCH');
                      }}
                      className={`w-full flex items-center justify-between rounded-2xl p-2.5 text-xs font-semibold transition ${
                        currentView === 'MAIN'
                          ? 'bg-amber-400 text-neutral-950 font-bold shadow-md shadow-amber-400/20'
                          : 'border border-white/10 bg-white/5 text-neutral-200 hover:bg-white/10'
                      }`}
                    >
                      <div className="flex items-center gap-3">
                        <IconBox className={currentView === 'MAIN' ? 'bg-neutral-950 text-amber-400 border-none' : ''}>
                          <PlaneSvg className="h-5 w-5" />
                        </IconBox>
                        <span className="text-sm font-medium">
                          {lang === 'ur' ? 'فلائٹ بکنگ پورٹل (Home)' : 'Flight Booking Portal'}
                        </span>
                      </div>
                      <span className="pe-2 text-xs opacity-70">➔</span>
                    </button>

                    {/* 2. Customer Dashboard */}
                    <button
                      onClick={() => {
                        setCurrentView('DASHBOARD');
                        setIsSideDrawerOpen(false);
                      }}
                      className={`w-full flex items-center justify-between rounded-2xl p-2.5 text-xs font-semibold transition ${
                        currentView === 'DASHBOARD'
                          ? 'bg-amber-400 text-neutral-950 font-bold shadow-md shadow-amber-400/20'
                          : 'border border-white/10 bg-white/5 text-neutral-200 hover:bg-white/10'
                      }`}
                    >
                      <div className="flex items-center gap-3">
                        <IconBox className={currentView === 'DASHBOARD' ? 'bg-neutral-950 text-amber-400 border-none' : ''}>
                          <DashboardSvg className="h-5 w-5" />
                        </IconBox>
                        <span className="text-sm font-medium">
                          {lang === 'ur' ? 'کسٹمر ڈیش بورڈ' : 'Customer Travel Dashboard'}
                        </span>
                      </div>
                      <span className="rounded-full bg-amber-400/30 px-2 py-0.5 text-xs font-mono font-bold text-amber-300">
                        {travelHistory.length}
                      </span>
                    </button>

                    {/* 3. Global Fleet Showcase */}
                    <button
                      onClick={() => {
                        setCurrentView('MAIN');
                        setIsSideDrawerOpen(false);
                        const f = document.getElementById('fleet');
                        if (f) f.scrollIntoView({ behavior: 'smooth' });
                      }}
                      className="w-full flex items-center justify-between rounded-2xl border border-white/10 bg-white/5 p-2.5 text-xs font-semibold text-neutral-200 hover:bg-white/10 transition"
                    >
                      <div className="flex items-center gap-3">
                        <IconBox>
                          <FleetSvg className="h-5 w-5" />
                        </IconBox>
                        <span className="text-sm font-medium">
                          {lang === 'ur' ? 'عالمی فضائی بیڑہ (Fleet Showcase)' : 'Global Fleet Showcase'}
                        </span>
                      </div>
                      <span className="pe-2 text-xs opacity-70">➔</span>
                    </button>

                    {/* 4. Biometric e-KYC Scanner */}
                    <button
                      onClick={() => {
                        setIsSideDrawerOpen(false);
                        startCamera();
                      }}
                      className="w-full flex items-center justify-between rounded-2xl border border-white/10 bg-white/5 p-2.5 text-xs font-semibold text-neutral-200 hover:bg-white/10 transition"
                    >
                      <div className="flex items-center gap-3">
                        <IconBox className="border-cyan-500/30 bg-cyan-500/10 text-cyan-300">
                          <ShieldSvg className="h-5 w-5" />
                        </IconBox>
                        <span className="text-sm font-medium">
                          {lang === 'ur' ? 'بائیو میٹرک پاسپورٹ اسکینر (e-KYC)' : 'Biometric e-KYC Scanner'}
                        </span>
                      </div>
                      <span className="h-2.5 w-2.5 rounded-full bg-cyan-400 animate-pulse me-2" />
                    </button>
                  </div>

                  {/* Settings Section: Currency & Language Switchers (with matching IconBox) */}
                  <div className="mt-5 pt-4 border-t border-white/10 space-y-3">
                    {/* Currency Switcher */}
                    <div className="flex items-center justify-between rounded-2xl border border-white/10 bg-white/5 p-2.5">
                      <div className="flex items-center gap-3">
                        <IconBox>
                          <CurrencySvg className="h-5 w-5" />
                        </IconBox>
                        <span className="text-xs font-semibold text-neutral-200">
                          {lang === 'ur' ? 'کرنسی منتخب کریں:' : 'Currency:'}
                        </span>
                      </div>
                      <select
                        value={currency}
                        onChange={(e) => setCurrency(e.target.value)}
                        className="rounded-xl border border-white/15 bg-[#0e1626] px-3 py-1.5 text-xs font-mono font-bold text-amber-300 cursor-pointer focus:outline-none"
                      >
                        {Object.values(CURRENCIES).map((c) => (
                          <option key={c.code} value={c.code} className="bg-[#0e1626]">
                            {c.code} ({c.symbol})
                          </option>
                        ))}
                      </select>
                    </div>

                    {/* Language Switcher */}
                    <div className="flex items-center justify-between rounded-2xl border border-white/10 bg-white/5 p-2.5">
                      <div className="flex items-center gap-3">
                        <IconBox>
                          <GlobeSvg className="h-5 w-5" />
                        </IconBox>
                        <span className="text-xs font-semibold text-neutral-200">
                          {lang === 'ur' ? 'زبان منتخب کریں:' : 'Language:'}
                        </span>
                      </div>
                      <select
                        value={lang}
                        onChange={(e) => handleLanguageChange(e.target.value)}
                        className="rounded-xl border border-white/15 bg-[#0e1626] px-3 py-1.5 text-xs font-medium text-white cursor-pointer focus:outline-none"
                      >
                        {LANGUAGES.map((l) => (
                          <option key={l.code} value={l.code} className="bg-[#0e1626]">
                            {l.flag} {l.nativeName}
                          </option>
                        ))}
                      </select>
                    </div>
                  </div>

                  {/* DATA BACKUP & RESTORE SECTION IN SIDE DRAWER */}
                  <div className="mt-5 pt-4 border-t border-white/10">
                    <div className="flex items-center gap-3 mb-3">
                      <IconBox>
                        <BackupSvg className="h-5 w-5" />
                      </IconBox>
                      <div>
                        <span className="text-xs font-bold text-amber-300 block">
                          {lang === 'ur' ? 'بیک اپ اور ڈیٹا سیکیورٹی سنٹر' : 'Data Backup Vault'}
                        </span>
                        <span className="text-[10px] text-neutral-400 block">
                          {lang === 'ur' ? 'تمام پروازوں کا ڈیٹا ڈیوائس پر محفوظ کریں' : 'Preserve bookings on your local device'}
                        </span>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <button
                        onClick={handleDownloadBackup}
                        className="flex items-center justify-center gap-2 rounded-2xl border border-amber-400/40 bg-amber-400/10 py-2.5 text-xs font-bold text-amber-300 hover:bg-amber-400/20 transition"
                      >
                        <DownloadSvg className="h-4 w-4" />
                        <span>{lang === 'ur' ? 'بیک اپ فائل لیں' : 'Export'}</span>
                      </button>

                      <label className="flex items-center justify-center gap-2 rounded-2xl border border-white/15 bg-white/5 py-2.5 text-xs font-bold text-neutral-300 hover:bg-white/10 cursor-pointer transition">
                        <UploadSvg className="h-4 w-4" />
                        <span>{lang === 'ur' ? 'بیک اپ بحال کریں' : 'Restore'}</span>
                        <input
                          type="file"
                          accept=".json"
                          onChange={handleRestoreBackup}
                          className="hidden"
                        />
                      </label>
                    </div>
                  </div>
                </div>

                {/* Side Drawer Footer Signature */}
                <div className="mt-8 pt-4 border-t border-white/10 text-center">
                  <div className="inline-flex items-center gap-2 rounded-full border border-amber-400/40 bg-amber-500/10 px-4 py-1.5 shadow-md shadow-amber-500/10">
                    <span className="text-amber-400 font-bold">✦</span>
                    <span className="font-serif text-xs font-bold text-amber-300">
                      Developed by Hamza Latif
                    </span>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* --- 4. WEBRTC LIVE CAMERA PASSPORT SCANNER MODAL --- */}
          {isKycOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4 backdrop-blur-xl animate-in fade-in">
              <div className="relative w-full max-w-2xl rounded-3xl border border-amber-400/40 bg-[#0d1527] shadow-2xl overflow-hidden">
                <div className="flex justify-between items-center border-b border-white/10 bg-[#121c33] px-6 py-4">
                  <div>
                    <h3 className="font-serif text-lg font-bold text-white">Live Camera Passport & e-KYC Verification</h3>
                    <p className="text-xs text-neutral-400">ICAO Doc 9303 Compliant • WebRTC Optical Security</p>
                  </div>
                  <button onClick={stopCamera} className="text-neutral-400 hover:text-white">✕</button>
                </div>

                <div className="p-6">
                  {/* Camera Viewport */}
                  <div className="relative aspect-video w-full rounded-2xl border border-white/15 bg-black overflow-hidden flex items-center justify-center">
                    <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover" />

                    {!cameraActive && (
                      <div className="absolute inset-0 flex flex-col items-center justify-center p-4 text-center bg-neutral-900/90">
                        <span className="text-3xl mb-2">📷</span>
                        <span className="font-bold text-white text-sm">WebRTC Optical Stream Simulator</span>
                        <span className="text-xs text-neutral-400 mt-1">Ready for document alignment</span>
                      </div>
                    )}

                    {/* Laser Alignment Guide */}
                    {kycStage === 'PASSPORT' && (
                      <div className="pointer-events-none absolute inset-4 border-2 border-dashed border-amber-400/70 rounded-2xl flex flex-col justify-between p-2">
                        <span className="font-mono text-[10px] text-amber-300">ALIGN PASSPORT MRZ MACHINE ZONE</span>
                        <div className="h-1 w-full bg-gradient-to-r from-transparent via-amber-300 to-transparent shadow-[0_0_15px_#d4af37] animate-laser"></div>
                        <span className="font-mono text-[10px] text-amber-300 text-center bg-black/50 py-0.5 rounded">16:9 HOLOGRAPHIC RETICLE</span>
                      </div>
                    )}

                    {kycStage === 'FACE' && (
                      <div className="pointer-events-none absolute h-48 w-36 rounded-[50%] border-2 border-dashed border-cyan-400 shadow-[0_0_30px_rgba(6,182,212,0.4)] flex items-center justify-center">
                        <span className="font-mono text-[10px] text-cyan-300">BIOMETRIC LIVENESS</span>
                      </div>
                    )}

                    {isScanning && (
                      <div className="absolute inset-0 bg-black/80 flex flex-col items-center justify-center font-mono text-xs text-amber-300">
                        <div className="h-8 w-8 border-2 border-amber-400 border-t-transparent rounded-full animate-spin mb-2"></div>
                        <span>CRYPTOGRAPHIC VALIDATION IN PROGRESS...</span>
                      </div>
                    )}
                  </div>

                  <div className="mt-6 flex gap-3">
                    {kycStage === 'PASSPORT' ? (
                      <button
                        onClick={handleScanPassport}
                        disabled={isScanning}
                        className="flex-1 rounded-2xl bg-gradient-to-r from-amber-400 to-amber-500 py-3 text-xs font-bold text-neutral-950 shadow-md hover:from-amber-300 transition"
                      >
                        Scan Passport Page
                      </button>
                    ) : (
                      <button
                        onClick={handleVerifyFace}
                        disabled={isScanning}
                        className="flex-1 rounded-2xl bg-gradient-to-r from-cyan-400 to-blue-500 py-3 text-xs font-bold text-white shadow-md hover:from-cyan-300 transition"
                      >
                        Verify Face Biometrics
                      </button>
                    )}

                    <button
                      onClick={stopCamera}
                      className="rounded-2xl border border-white/15 px-5 py-3 text-xs text-neutral-300"
                    >
                      Close
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* --- 5. MANDATORY AUTH MODAL --- */}
          {isAuthOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4 backdrop-blur-xl animate-in fade-in">
              <div className="relative w-full max-w-md rounded-3xl border border-amber-400/40 bg-[#0d1424] shadow-2xl overflow-hidden p-6">
                <div className="flex justify-between items-center border-b border-white/10 pb-3 mb-4">
                  <h3 className="font-serif text-lg font-bold text-white">Passenger Identity & Sign In</h3>
                  <button onClick={() => setIsAuthOpen(false)} className="text-neutral-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const u = {
                    name: 'Hamza Latif',
                    cnic: '31302-5257137-7',
                    phone: '+92 300 1234567',
                    email: 'hamza.latif@flywithsky.com'
                  };
                  setCurrentUser(u);
                  localStorage.setItem('flywithsky_user', JSON.stringify(u));
                  setIsAuthOpen(false);
                }} className="space-y-4">
                  <div>
                    <label className="block text-xs text-neutral-300 mb-1">Full Legal Name</label>
                    <input
                      type="text"
                      defaultValue="Hamza Latif"
                      className="w-full rounded-2xl border border-white/15 bg-white/5 px-4 py-2.5 text-sm text-white focus:border-amber-400 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs text-neutral-300 mb-1">CNIC / National Identity Card Number</label>
                    <input
                      type="text"
                      defaultValue="31302-5257137-7"
                      className="w-full rounded-2xl border border-white/15 bg-white/5 px-4 py-2.5 text-sm font-mono text-white focus:border-amber-400 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs text-neutral-300 mb-1">Mobile Phone Number</label>
                    <input
                      type="tel"
                      defaultValue="+92 300 1234567"
                      className="w-full rounded-2xl border border-white/15 bg-white/5 px-4 py-2.5 text-sm text-white focus:border-amber-400 focus:outline-none"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full rounded-2xl bg-gradient-to-r from-amber-400 to-amber-500 py-3 text-sm font-bold text-neutral-950 shadow-md hover:from-amber-300 transition"
                  >
                    Activate Profile & Proceed ➔
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* --- 6. FOOTER WITH MANDATORY SIGNATURE: "Developed by Hamza Latif" --- */}
          <footer className="border-t border-white/10 bg-[#060a14] text-xs text-neutral-400">
            <div className="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-10">
              <div className="flex flex-col sm:flex-row items-center justify-between gap-6">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-serif text-lg font-bold text-white">The Fly With Sky</span>
                    <span className="text-[10px] text-amber-300 border border-amber-400/30 px-2 py-0.5 rounded-full">
                      The Sovereign Flagship
                    </span>
                  </div>
                  <p className="mt-1 text-[11px] text-neutral-500">
                    Intercontinental Flagship Luxury Airline • Lahore, Karachi, Islamabad, Dubai, New York, London
                  </p>
                </div>

                {/* MANDATORY DEVELOPER SIGNATURE IN GOLD BADGE */}
                <div className="flex items-center gap-2 rounded-full border border-amber-400/50 bg-gradient-to-r from-amber-500/20 via-amber-400/10 to-amber-500/20 px-5 py-2 shadow-lg shadow-amber-500/15">
                  <span className="text-amber-400 font-bold text-sm">✦</span>
                  <span className="text-[11px] font-medium text-neutral-300">Official Creator:</span>
                  <span className="font-serif text-xs font-bold tracking-wider text-amber-300">
                    Developed by Hamza Latif
                  </span>
                </div>
              </div>

              <div className="mt-6 border-t border-white/5 pt-4 text-center text-[10px] text-neutral-600">
                © 2026 The Fly With Sky Airlines Group LLC. All global flight operations certified under ICAO Doc 9303 PKD.
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<TheFlyWithSkyApp />, document.getElementById('root'));
  </script>
</body>
</html>
