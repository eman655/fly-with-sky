<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>امپیریئن ایئرویز | EMPYREAN AIRWAYS - شاہی عالمی پروازیں</title>
  
  <!-- Fonts: Noto Nastaliq Urdu, Cinzel, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossOrigin="anonymous" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@300;400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#eab308',
              navy: '#0b1120',
              card: '#111827',
            }
          },
          fontFamily: {
            urdu: ['"Noto Nastaliq Urdu"', 'serif'],
            serif: ['Cinzel', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <!-- React 18, ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #070a12;
      color: #f3f4f6;
      font-family: 'Noto Nastaliq Urdu', 'Inter', serif;
      overflow-x: hidden;
    }
    [dir="ltr"] {
      text-align: left;
      font-family: 'Inter', sans-serif;
    }
    [dir="rtl"] {
      text-align: right;
    }
    input, select, button {
      font-family: inherit;
    }
    /* Clean custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 4px;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      #printable-ticket, #printable-ticket * {
        visibility: visible;
      }
      #printable-ticket {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: white !important;
        color: black !important;
      }
    }
  </style>
</head>
<body class="bg-[#070a12] text-neutral-100 antialiased selection:bg-amber-400 selection:text-black">
  <div id="root"></div>

  <!-- Main Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- AIRPORTS DATA ---
    const AIRPORTS = [
      { iata: 'LHE', city: 'لاہور (Lahore)', cityEn: 'Lahore', country: 'پاکستان', name: 'علامہ اقبال انٹرنیشنل' },
      { iata: 'KHI', city: 'کراچی (Karachi)', cityEn: 'Karachi', country: 'پاکستان', name: 'جناح انٹرنیشنل' },
      { iata: 'ISB', city: 'اسلام آباد (Islamabad)', cityEn: 'Islamabad', country: 'پاکستان', name: 'اسلام آباد انٹرنیشنل' },
      { iata: 'DXB', city: 'دبئی (Dubai)', cityEn: 'Dubai', country: 'متحدہ عرب امارات', name: 'دبئی انٹرنیشنل' },
      { iata: 'JFK', city: 'نیویارک (New York)', cityEn: 'New York', country: 'امریکہ', name: 'جان ایف کینیڈی انٹرنیشنل' },
      { iata: 'LHR', city: 'لندن (London)', cityEn: 'London', country: 'برطانیہ', name: 'ہیتھرو ایئرپورٹ' }
    ];

    // --- CURRENCIES WITH PKR DEFAULT ---
    const CURRENCIES = {
      PKR: { code: 'PKR', symbol: '₨', rate: 278.5, format: (amt) => `₨ ${Math.round(amt * 278.5).toLocaleString('ur-PK')}` },
      USD: { code: 'USD', symbol: '$', rate: 1.0, format: (amt) => `$${Math.round(amt).toLocaleString('en-US')}` },
      AED: { code: 'AED', symbol: 'د.إ', rate: 3.67, format: (amt) => `${Math.round(amt * 3.67).toLocaleString('ar-AE')} AED` }
    };

    // --- FLIGHTS CATALOG ---
    const FLIGHTS = [
      {
        id: 'EMP-701',
        flightNumber: 'EMP 701',
        origin: AIRPORTS[0], // LHE
        destination: AIRPORTS[3], // DXB
        departureTime: '09:15',
        arrivalTime: '11:55',
        duration: '3 گھنٹے 40 منٹ',
        aircraft: 'بوئنگ 777-300ER (Boeing 777)',
        stops: 'براہِ راست (Non-Stop)',
        priceUSD: { economy: 320, business: 850, first_suite: 2100 },
        baggage: '2 عدد بیگ (46 کلوگرام) + 7 کلو ہینڈ کیری',
        meal: 'گرم ناشتہ و حلال چکن بریانی'
      },
      {
        id: 'EMP-301',
        flightNumber: 'EMP 301',
        origin: AIRPORTS[0], // LHE
        destination: AIRPORTS[1], // KHI
        departureTime: '08:00',
        arrivalTime: '09:45',
        duration: '1 گھنٹہ 45 منٹ',
        aircraft: 'ایئربس A330 (Airbus A330)',
        stops: 'ڈومیسٹک نان سٹاپ',
        priceUSD: { economy: 95, business: 250, first_suite: 480 },
        baggage: '30 کلوگرام + 7 کلو ہینڈ کیری',
        meal: 'گرم پیٹس، چائے اور تازہ جوس'
      },
      {
        id: 'EMP-901',
        flightNumber: 'EMP 901',
        origin: AIRPORTS[0], // LHE
        destination: AIRPORTS[4], // JFK
        departureTime: '03:40',
        arrivalTime: '14:30',
        duration: '16 گھنٹے 50 منٹ',
        aircraft: 'بوئنگ 777 فلیگ شپ (Boeing 777)',
        stops: 'دبئی کے راستے 1 سٹاپ (1h 40m ٹرانزٹ)',
        priceUSD: { economy: 880, business: 3100, first_suite: 6900 },
        baggage: '2 عدد بیگ (64 کلوگرام) + 10 کلو ہینڈ کیری',
        meal: '3 کورس شاہی ضیافت، مٹن کڑاہی اور ہائی ٹی'
      },
      {
        id: 'EMP-905',
        flightNumber: 'EMP 905',
        origin: AIRPORTS[1], // KHI
        destination: AIRPORTS[4], // JFK
        departureTime: '04:15',
        arrivalTime: '15:10',
        duration: '16 گھنٹے 55 منٹ',
        aircraft: 'بوئنگ 777 فلیگ شپ (Boeing 777)',
        stops: 'دبئی کے راستے 1 سٹاپ (1h 30m ٹرانزٹ)',
        priceUSD: { economy: 850, business: 3000, first_suite: 6800 },
        baggage: '2 عدد بیگ (64 کلوگرام) + 10 کلو ہینڈ کیری',
        meal: 'شاہی بریانی، ڈیزرٹ اور ہاٹ لنچ'
      },
      {
        id: 'EMP-703',
        flightNumber: 'EMP 703',
        origin: AIRPORTS[1], // KHI
        destination: AIRPORTS[3], // DXB
        departureTime: '13:30',
        arrivalTime: '14:45',
        duration: '2 گھنٹے 15 منٹ',
        aircraft: 'بوئنگ 787 ڈریم لائنر (Dreamliner)',
        stops: 'براہِ راست (Non-Stop)',
        priceUSD: { economy: 240, business: 690, first_suite: 1750 },
        baggage: '35 کلوگرام + 7 کلو ہینڈ کیری',
        meal: 'سپیشل سندھی بریانی اور گلاب جامن'
      },
      {
        id: 'EMP-801',
        flightNumber: 'EMP 801',
        origin: AIRPORTS[2], // ISB
        destination: AIRPORTS[5], // LHR
        departureTime: '11:00',
        arrivalTime: '15:15',
        duration: '8 گھنٹے 15 منٹ',
        aircraft: 'بوئنگ 777-300ER Non-stop',
        stops: 'براہِ راست لندن (Non-Stop)',
        priceUSD: { economy: 650, business: 2200, first_suite: 5200 },
        baggage: '2 عدد بیگ (46 کلوگرام) + 7 کلو ہینڈ کیری',
        meal: 'روایتی و کانٹینینٹل کھانا اور چائے'
      }
    ];

    function App() {
      // User Profile & Authentication State
      const [currentUser, setCurrentUser] = useState(null);
      const [isAuthOpen, setIsAuthOpen] = useState(false);
      const [authMode, setAuthMode] = useState('LOGIN'); // 'LOGIN' | 'REGISTER'
      const [loginMethod, setLoginMethod] = useState('CNIC'); // 'CNIC' | 'EMAIL' | 'PHONE'
      const [authId, setAuthId] = useState('');
      const [authPass, setAuthPass] = useState('');
      const [regData, setRegData] = useState({ name: '', cnic: '', phone: '', email: '', pass: '' });
      const [authError, setAuthError] = useState('');

      // Settings
      const [currency, setCurrency] = useState('PKR');
      const [lang, setLang] = useState('ur'); // 'ur' | 'en'

      // Booking State
      const [step, setStep] = useState('SEARCH'); // 'SEARCH' | 'PASSENGER_FORM' | 'CONFIRMED'
      const [originIata, setOriginIata] = useState('LHE');
      const [destIata, setDestIata] = useState('DXB');
      const [departDate, setDepartDate] = useState('2026-10-20');
      const [cabin, setCabin] = useState('economy'); // 'economy' | 'business' | 'first_suite'

      const [selectedFlight, setSelectedFlight] = useState(FLIGHTS[0]);
      const [availableFlights, setAvailableFlights] = useState(FLIGHTS);

      // Passenger Details Form
      const [passengerForm, setPassengerForm] = useState({
        fullName: '',
        cnic: '',
        passportNumber: '',
        phone: '',
        email: '',
        dob: '1995-05-10',
        gender: 'مرد (Male)',
        meal: 'حلال چکن بریانی (Halal Chicken Biryani)'
      });

      // Confirmed Ticket
      const [confirmedBooking, setConfirmedBooking] = useState(null);

      // Modals
      const [isKycOpen, setIsKycOpen] = useState(false);

      // Load persistent user from localStorage
      useEffect(() => {
        try {
          const saved = localStorage.getItem('empyrean_user');
          if (saved) {
            const parsed = JSON.parse(saved);
            setCurrentUser(parsed);
            setPassengerForm((prev) => ({
              ...prev,
              fullName: parsed.name,
              cnic: parsed.cnic,
              phone: parsed.phone,
              email: parsed.email
            }));
          }
        } catch (e) {}
      }, []);

      const curr = CURRENCIES[currency];

      // Quick Route Helper
      const selectQuickRoute = (o, d) => {
        setOriginIata(o);
        setDestIata(d);
        const matches = FLIGHTS.filter((f) => f.origin.iata === o && f.destination.iata === d);
        if (matches.length > 0) {
          setAvailableFlights(matches);
          setSelectedFlight(matches[0]);
        } else {
          setAvailableFlights(FLIGHTS);
        }
      };

      // Search Handler
      const handleSearch = (e) => {
        e.preventDefault();
        const matches = FLIGHTS.filter((f) => f.origin.iata === originIata && f.destination.iata === destIata);
        if (matches.length > 0) {
          setAvailableFlights(matches);
        } else {
          setAvailableFlights(FLIGHTS);
        }
      };

      // Proceed to Passenger form
      const startBookingFlight = (flight) => {
        setSelectedFlight(flight);
        setStep('PASSENGER_FORM');
        window.scrollTo({ top: 300, behavior: 'smooth' });
      };

      // Issue Confirmed E-Ticket
      const issueTicket = (e) => {
        e.preventDefault();
        const booking = {
          pnr: 'EMP-' + Math.floor(1000 + Math.random() * 9000),
          ticketNo: '724-' + Math.floor(1000000000 + Math.random() * 9000000000),
          flight: selectedFlight,
          cabin: cabin,
          passenger: passengerForm,
          seat: cabin === 'first_suite' ? '1A' : cabin === 'business' ? '3F' : '14C',
          date: departDate,
          issueDate: new Date().toLocaleDateString('ur-PK')
        };
        setConfirmedBooking(booking);
        setStep('CONFIRMED');
        window.scrollTo({ top: 200, behavior: 'smooth' });
      };

      // Auth: Register
      const handleRegister = (e) => {
        e.preventDefault();
        if (!regData.name || !regData.cnic || !regData.phone || !regData.pass) {
          setAuthError('تمام ضروری خانے پر کریں۔');
          return;
        }
        const user = {
          name: regData.name,
          cnic: regData.cnic,
          phone: regData.phone,
          email: regData.email || `${regData.cnic}@empyrean.pk`,
          tier: 'گولڈ وی آئی پی (Gold VIP)'
        };
        setCurrentUser(user);
        try {
          localStorage.setItem('empyrean_user', JSON.stringify(user));
        } catch (e) {}
        setPassengerForm((prev) => ({
          ...prev,
          fullName: user.name,
          cnic: user.cnic,
          phone: user.phone,
          email: user.email
        }));
        setIsAuthOpen(false);
      };

      // Auth: Login
      const handleLogin = (e) => {
        e.preventDefault();
        if (!authId || !authPass) {
          setAuthError('شناختی کارڈ / ای میل اور پاس ورڈ درج کریں۔');
          return;
        }
        const user = {
          name: loginMethod === 'CNIC' ? 'محمد طارق علی (Tariq Ali)' : 'معزز مسافر',
          cnic: loginMethod === 'CNIC' ? authId : '35201-1234567-1',
          phone: loginMethod === 'PHONE' ? authId : '0300-1234567',
          email: loginMethod === 'EMAIL' ? authId : 'user@empyrean.pk',
          tier: 'رائل ممبر (Royal Member)'
        };
        setCurrentUser(user);
        try {
          localStorage.setItem('empyrean_user', JSON.stringify(user));
        } catch (e) {}
        setPassengerForm((prev) => ({
          ...prev,
          fullName: user.name,
          cnic: user.cnic,
          phone: user.phone,
          email: user.email
        }));
        setIsAuthOpen(false);
      };

      const handleLogout = () => {
        setCurrentUser(null);
        try {
          localStorage.removeItem('empyrean_user');
        } catch (e) {}
      };

      return (
        <div dir={lang === 'ur' ? 'rtl' : 'ltr'} className="min-h-screen">
          {/* Header */}
          <header className="sticky top-0 z-40 w-full border-b border-white/10 bg-[#0a0f1d]/95 backdrop-blur-md px-4 py-3 sm:px-8">
            <div className="mx-auto flex max-w-7xl items-center justify-between">
              {/* Brand */}
              <div className="flex items-center gap-3">
                <div className="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-amber-400 to-amber-600 text-neutral-950 font-bold shadow-lg shadow-amber-500/20 text-xl">
                  ✈
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-serif text-xl sm:text-2xl font-bold tracking-wider text-white">
                      {lang === 'ur' ? 'امپیریئن ایئرویز' : 'EMPYREAN AIRWAYS'}
                    </span>
                    <span className="rounded-full bg-amber-400/20 px-2 py-0.5 text-[10px] font-bold text-amber-300 border border-amber-400/30">
                      FLAGSHIP
                    </span>
                  </div>
                  <p className="text-[11px] text-neutral-400">
                    شاہی عالمی پروازیں • The Sovereign Global Airline
                  </p>
                </div>
              </div>

              {/* Header Right Controls */}
              <div className="flex items-center gap-2 sm:gap-4">
                {/* User Auth Profile */}
                {currentUser ? (
                  <div className="flex items-center gap-2 rounded-2xl border border-amber-400/40 bg-amber-400/10 px-3 py-1.5 text-xs">
                    <div className="h-7 w-7 rounded-full bg-amber-400 text-neutral-950 font-bold flex items-center justify-center">
                      {currentUser.name.charAt(0)}
                    </div>
                    <div className="hidden sm:block text-start leading-tight">
                      <span className="block font-bold text-white">{currentUser.name}</span>
                      <span className="block font-mono text-[10px] text-amber-300">CNIC: {currentUser.cnic}</span>
                    </div>
                    <button
                      onClick={handleLogout}
                      className="ms-2 text-neutral-400 hover:text-red-400 text-xs font-semibold"
                    >
                      لاگ آؤٹ
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => {
                      setAuthMode('LOGIN');
                      setIsAuthOpen(true);
                    }}
                    className="rounded-xl bg-gradient-to-r from-amber-400 to-amber-500 px-4 py-2 text-xs font-bold text-neutral-950 shadow-md hover:from-amber-300 transition"
                  >
                    لاگ ان / اکاؤنٹ بنائیں
                  </button>
                )}

                {/* Currency Switcher */}
                <select
                  value={currency}
                  onChange={(e) => setCurrency(e.target.value)}
                  className="rounded-xl border border-white/15 bg-[#111827] px-2.5 py-1.5 text-xs font-bold text-amber-300 cursor-pointer"
                >
                  <option value="PKR">روپے (PKR ₨)</option>
                  <option value="USD">ڈالر (USD $)</option>
                  <option value="AED">درہم (AED د.إ)</option>
                </select>

                {/* Language Switcher */}
                <button
                  onClick={() => setLang(lang === 'ur' ? 'en' : 'ur')}
                  className="rounded-xl border border-white/15 bg-white/5 px-2.5 py-1.5 text-xs font-bold text-white hover:border-amber-400"
                >
                  {lang === 'ur' ? 'English (EN)' : 'اردو (Urdu)'}
                </button>
              </div>
            </div>
          </header>

          {/* Clean, Non-Cluttered Hero Banner */}
          <section className="relative py-8 sm:py-12 border-b border-white/10 bg-gradient-to-b from-[#0a0f1d] to-[#070a12] text-center px-4">
            <div className="mx-auto max-w-4xl">
              <span className="inline-block rounded-full bg-amber-400/10 border border-amber-400/30 px-3 py-1 text-xs text-amber-300 font-bold mb-3">
                ✦ امپیریئن ایئرویز — ایک باوقار سفر کا آغاز ✦
              </span>
              <h1 className="font-serif text-3xl sm:text-5xl font-bold text-white tracking-tight leading-tight">
                آسانی، راحت اور فخریہ انداز کے ساتھ پرواز کریں
              </h1>
              <p className="mt-3 text-sm sm:text-base text-neutral-300 max-w-2xl mx-auto leading-relaxed">
                لاہور، کراچی، اسلام آباد سے دبئی، نیویارک، اور لندن کی براہِ راست پروازیں اب باآسانی بک کریں۔
              </p>

              {/* Popular Routes Buttons */}
              <div className="mt-6 flex flex-wrap items-center justify-center gap-2">
                <span className="text-xs text-neutral-400">تیز ترین روٹس:</span>
                <button
                  onClick={() => selectQuickRoute('LHE', 'DXB')}
                  className="rounded-full border border-white/15 bg-white/5 px-3 py-1 text-xs text-neutral-200 hover:border-amber-400 hover:text-amber-300 transition"
                >
                  لاہور ⇄ دبئی
                </button>
                <button
                  onClick={() => selectQuickRoute('LHE', 'KHI')}
                  className="rounded-full border border-white/15 bg-white/5 px-3 py-1 text-xs text-neutral-200 hover:border-amber-400 hover:text-amber-300 transition"
                >
                  لاہور ⇄ کراچی
                </button>
                <button
                  onClick={() => selectQuickRoute('LHE', 'JFK')}
                  className="rounded-full border border-white/15 bg-white/5 px-3 py-1 text-xs text-neutral-200 hover:border-amber-400 hover:text-amber-300 transition"
                >
                  لاہور ⇄ نیویارک
                </button>
                <button
                  onClick={() => selectQuickRoute('KHI', 'JFK')}
                  className="rounded-full border border-white/15 bg-white/5 px-3 py-1 text-xs text-neutral-200 hover:border-amber-400 hover:text-amber-300 transition"
                >
                  کراچی ⇄ نیویارک
                </button>
                <button
                  onClick={() => selectQuickRoute('ISB', 'LHR')}
                  className="rounded-full border border-white/15 bg-white/5 px-3 py-1 text-xs text-neutral-200 hover:border-amber-400 hover:text-amber-300 transition"
                >
                  اسلام آباد ⇄ لندن
                </button>
              </div>
            </div>
          </section>

          {/* Main Booking Container */}
          <main className="max-w-6xl mx-auto px-4 py-8">
            {/* STEP 1: FLIGHT SEARCH & RESULTS */}
            {step === 'SEARCH' && (
              <div className="space-y-6">
                {/* Search Form Card */}
                <div className="rounded-3xl border border-white/15 bg-[#0e1424] p-6 shadow-xl">
                  <div className="flex justify-between items-center border-b border-white/10 pb-4 mb-4">
                    <h2 className="text-lg font-bold text-white flex items-center gap-2">
                      <span>پرواز تلاش کریں</span>
                    </h2>

                    {/* Cabin Class */}
                    <div className="flex gap-2">
                      {[
                        { id: 'economy', label: 'اکانومی کلاس' },
                        { id: 'business', label: 'بزنس کلاس' },
                        { id: 'first_suite', label: 'شاہی فرسٹ کلاس' }
                      ].map((c) => (
                        <button
                          key={c.id}
                          onClick={() => setCabin(c.id)}
                          className={`rounded-xl px-3 py-1.5 text-xs font-bold transition ${
                            cabin === c.id
                              ? 'bg-amber-400 text-neutral-950 shadow'
                              : 'border border-white/10 bg-white/5 text-neutral-300'
                          }`}
                        >
                          {c.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <form onSubmit={handleSearch} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div className="rounded-2xl border border-white/10 bg-white/5 p-3">
                      <label className="block text-xs text-neutral-400 mb-1">کہاں سے (روانگی)</label>
                      <select
                        value={originIata}
                        onChange={(e) => setOriginIata(e.target.value)}
                        className="w-full bg-transparent font-bold text-white focus:outline-none cursor-pointer text-base"
                      >
                        {AIRPORTS.map((a) => (
                          <option key={a.iata} value={a.iata} className="bg-[#0e1424]">
                            {a.city}
                          </option>
                        ))}
                      </select>
                    </div>

                    <div className="rounded-2xl border border-white/10 bg-white/5 p-3">
                      <label className="block text-xs text-neutral-400 mb-1">کہاں تک (منزل)</label>
                      <select

                  <form onSubmit={handleRegister} className="space-y-3">
                    <div>
                      <label className="block text-xs text-neutral-300 mb-1">پورا نام (Full Name) *</label>
                      <input
                        type="text"
                        required
                        value={regData.name}
                        onChange={(e) => setRegData({ ...regData, name: e.target.value })}
                        placeholder="محمد طارق علی"
                        className="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-white focus:border-amber-400 focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-xs text-neutral-300 mb-1">شناختی کارڈ نمبر (CNIC) *</label>
                      <input
                        type="text"
                        required
                        value={regData.cnic}
                        onChange={(e) => setRegData({ ...regData, cnic: e.target.value })}
                        placeholder="35201-1234567-1"
                        className="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-white focus:border-amber-400 focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-xs text-neutral-300 mb-1">موبائل فون نمبر *</label>
                      <input
                        type="text"
                        required
                        value={regData.phone}
                        onChange={(e) => setRegData({ ...regData, phone: e.target.value })}
                        placeholder="0300-1234567"
                        className="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-white focus:border-amber-400 focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-xs text-neutral-300 mb-1">ای میل ایڈریس</label>
                      <input
                        type="email"
                        value={regData.email}
                        onChange={(e) => setRegData({ ...regData, email: e.target.value })}
                        placeholder="tariq@gmail.com"
                        className="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-white focus:border-amber-400 focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-xs text-neutral-300 mb-1">پاس ورڈ (Password) *</label>
                      <input
                        type="password"
                        required
                        value={regData.pass}
                        onChange={(e) => setRegData({ ...regData, pass: e.target.value })}
                        placeholder="کم از کم 6 ہندسے"
                        className="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-white focus:border-amber-400 focus:outline-none"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full rounded-xl bg-gradient-to-r from-amber-400 to-amber-500 py-3 text-sm font-bold text-neutral-950 shadow-md hover:from-amber-300"
                    >
                      رجسٹر کریں (Register)
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-white/10 bg-[#0a0f1d] py-8 text-xs text-neutral-400 px-4 text-center">
            <p className="font-serif font-bold text-white text-base">امپیریئن ایئرویز (EMPYREAN AIRWAYS)</p>
            <p className="mt-1 text-neutral-500">حکومت سے منظور شدہ بین الاقوامی و ملکی پروازیں • 24/7 ہیلپ لائن: 111-EMPYREAN</p>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
